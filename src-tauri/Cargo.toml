[package]
name = "trimbit"
version = "2.0.0"
description = "An unofficial menu bar companion for the Headroom proxy"
authors = ["Mehmet Oğuz Tozkoparan"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "trimbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-log = "2.9.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
# Plain HTTP to loopback only: no TLS stack, no proxy, no redirects.
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSGlassEffectView", "NSView", "NSResponder", "NSWindow", "NSGraphics", "objc2-core-foundation"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
