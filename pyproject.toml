[project]
name = "trimbit-legacy"
dynamic = ["version"]
description = "macOS menu bar monitor for the Headroom optimization proxy"
requires-python = ">=3.10"
dependencies = ["rumps==0.4.0", "pyobjc-framework-Cocoa>=10"]

[project.scripts]
trimbit-legacy = "trimbit_legacy.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "trimbit-legacy-env", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # PyObjC selector names
