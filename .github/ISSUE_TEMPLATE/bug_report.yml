name: Bug report
description: Something in Trimbit doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The versions below let the issue be reproduced without back-and-forth.
        Trimbit's version is in **Settings → Updates**; Headroom's is in the panel header (for example `v0.37.0`).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 26.0 / Windows 11 24H2 / Ubuntu 24.04 (GNOME)"
  - type: input
    id: trimbit
    attributes:
      label: Trimbit version
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: headroom
    attributes:
      label: Headroom version
      placeholder: "0.37.0"
  - type: textarea
    id: logs
    attributes:
      label: Log excerpt (optional)
      description: Settings → Logs → Open Folder. Paste the last few lines; they contain no request contents or keys.
      render: text
